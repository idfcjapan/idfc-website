  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
  <style>
    :root { color-scheme: light; --accent: #98454A; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #F7F3EA; color: #173D39;
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif; }
    .intro, .outro { padding: 100px 6vw; }
    .intro { min-height: 70svh; display: grid; align-content: center; gap: 24px; }
    .intro h1 { margin: 0; font-size: clamp(30px, 5vw, 64px); }
    p { line-height: 1.9; }
    a { color: inherit; text-underline-offset: .3em; }
    a:focus-visible { outline: 3px solid #98454A; outline-offset: 6px; }
    #story { min-height: 100svh; display: grid; align-content: center;
      gap: 32px; padding: 8vh 6vw; overflow: clip; isolation: isolate; }
    .kicker { margin: 0; font-size: 14px; letter-spacing: .15em; }
    h2 { margin: 0; font-family: "Noto Serif JP", "Yu Mincho", serif;
      font-size: clamp(48px, 6.5vw, 100px); line-height: 1.25; }
    .word { display: block; }
    .word:last-child { color: var(--accent); }
    .photo-grid { display: grid; grid-template-columns: 1fr 1.25fr 1fr;
      align-items: center; gap: 20px; }
    figure { margin: 0; padding: 10px; border-radius: 14px;
      background: #F7F3EA; color: #173D39; border: 1px solid #173D3926; }
    img { display: block; width: 100%; height: auto; border-radius: 6px; }
    figcaption { padding: 10px 4px 2px; font-size: 14px; }
    .photo--center { box-shadow: 0 16px 40px #173D391A; }
    @media (max-width: 900px) {
      #story { min-height: auto; padding-block: 56px; }
      .photo-grid { grid-template-columns: 1fr; gap: 24px; }
      h2 { font-size: clamp(36px, 8vw, 64px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>

          });
          scene
            .from('.word', { y: 36, opacity: 0.3, stagger: 0.1 }, 0)
            .from('.photo--left', { xPercent: -12, rotation: -7 }, 0)
            .from('.photo--right', { xPercent: 12, rotation: 7 }, 0)
            .from('.photo--center', { scale: 0.9 }, 0)
            .to('.photo--center', { yPercent: -8 }, 0)
            .to(stage, { backgroundColor: '#173D39', color: '#F7F3EA',
              '--accent': '#D7A952', duration: 1.4 }, 0.15);
          ScrollTrigger.refresh();

          return () => {
            gsap.ticker.remove(tick);
            lenis.off('scroll', ScrollTrigger.update);
            lenis.destroy();
          };
        }, stage);
      });
    })();
  </script>
</body>
</html>
